
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>DiaryBloom</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f7f3e9;
      color: #222222;
      font-family: Georgia, "Times New Roman", serif;
    }

    .container {
      max-width: 650px;
      margin: 60px auto;
      text-align: center;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 44px;
      font-weight: normal;
      margin: 16px 0 8px;
    }

    .tagline {
      font-size: 14px;
      font-style: italic;
      color: #555555;
      line-height: 1.6;
    }

    hr {
      border: none;
      border-top: 1px solid #555555;
      margin: 30px 0;
    }

    h2 {
      font-size: 24px;
      font-weight: normal;
      margin-bottom: 24px;
    }

    .link {
      display: block;
      text-align: left;
      padding: 22px 4px;
      text-decoration: none;
      color: inherit;
      border-bottom: 1px solid #d4cfc4;
    }

    .link-title {
      display: flex;
      justify-content: space-between;
      font-size: 17px;
      font-weight: bold;
    }

    .description {
      font-size: 13px;
      color: #666666;
      margin-top: 8px;
    }

    .link:hover {
      background: #eee9de;
    }

    footer {
      margin-top: 30px;
      color: #777777;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      .container { margin: 35px auto; }
      h1 { font-size: 36px; }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="eyebrow">
      EST. 2026 · DIARYBLOOM
    </div>

    <h1>DiaryBloom</h1>

    <p class="tagline">
      A little space for thoughts, dreams,
      and everything in between.
    </p>

    <hr>

    <a class="link" href="privacy-policy.html">
      <div class="link-title">
        <span>Privacy Policy</span>
        <span>↗</span>
      </div>
      <div class="description">
        How your information is stored and protected.
      </div>
    </a>

    <a class="link" href="terms-of-service.html">
      <div class="link-title">
        <span>Terms of Service</span>
        <span>↗</span>
      </div>
      <div class="description">
        The terms governing your use of DiaryBloom.
      </div>
    </a>

    <hr>

    <footer>
      © 2026 DiaryBloom
    </footer>

  </main>
</body>
</html>
